[package]
name = "qriff"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A fast local QR code scanner for Linux desktops"
repository = "https://github.com/Wattos/qriff"

# Keep the library name stable for existing integrations and benchmarks.
[lib]
name = "qr_scanner"

[features]
# Optional comparison backend; tiny-skia remains available as a fallback.
gpu = ["iced/wgpu"]

[dependencies]
anyhow = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
iced = { version = "0.14", default-features = false, features = ["advanced", "tiny-skia", "tokio", "wayland", "x11", "canvas", "image-without-codecs"] }
ksni = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "process", "io-util", "sync", "rt-multi-thread", "macros"] }

futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.11.0"
url = "2.5.8"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screenshot", "settings"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
v4l = "0.14"
nokhwa-core = { version = "0.1.9", features = ["mjpeg"] }

[dev-dependencies]
iced_runtime = "0.14"
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
